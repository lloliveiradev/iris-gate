name: Bug report
description: Report a defect in Iris Gate
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Security vulnerabilities do not belong in a public issue. Use **Report a vulnerability** on the Security tab (see SECURITY.md).
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Same names as the Trello area labels. Pick the closest one.
      options:
        - api
        - web
        - antifraud
        - core
        - messaging
        - infra
        - ci
        - security
        - identity
        - payments
        - contracts
        - docs
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Smallest sequence that triggers the bug.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Go, Node, OS, and the command you ran (`make test`, `make dev`, a route).
      placeholder: |
        Go 1.27, Node 26, Linux
        make -C apps/api test
    validations:
      required: true
