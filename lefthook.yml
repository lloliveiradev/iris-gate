# lefthook — git hooks runner (https://github.com/evilmartians/lefthook)
#
# Install:  make install-hooks   (or: lefthook install)
# Bypass:   git commit --no-verify   (ONLY in a justified emergency)

pre-commit:
  parallel: true
  commands:
    gofumpt:
      glob: "*.go"
      run: |
        if ! command -v gofumpt >/dev/null 2>&1; then
          echo "✗ gofumpt is not installed. Run: go install mvdan.cc/gofumpt@latest" >&2
          exit 1
        fi
        gofumpt -l -w {staged_files}
        git add {staged_files}

    go-vet:
      glob: "apps/api/**/*.go"
      run: cd apps/api && go vet ./...

    prettier:
      glob: "*.{ts,tsx,js,jsx,json,yml,yaml,md,css}"
      exclude:
        - "libs/contracts/generated/**"
        - "**/*.generated.*"
      run: |
        if ! command -v yarn >/dev/null 2>&1; then
          echo "✗ yarn is not installed. Run: corepack enable" >&2
          exit 1
        fi
        yarn prettier --write {staged_files}
        git add {staged_files}

    gitleaks:
      run: |
        if ! command -v gitleaks >/dev/null 2>&1; then
          echo "⚠ gitleaks is not installed; skipping. Install: brew install gitleaks" >&2
          exit 0
        fi
        gitleaks protect --staged --redact --verbose

commit-msg:
  commands:
    # Lightweight Conventional Commits: "type(scope): subject" or "type: subject"
    conventional:
      run: |
        msg=$(head -n1 "{1}")
        # Merges, reverts and comment lines skip validation
        case "$msg" in
          "Merge "*|"Revert "*|"#"*) exit 0 ;;
        esac
        if ! echo "$msg" | grep -qE '^(feat|fix|chore|docs|refactor|test|build|ci|perf|style|revert)(\([a-z0-9_-]+\))?!?: .{3,}'; then
          echo "✗ commit message does not follow Conventional Commits."
          echo "  Expected: type(scope): subject   (type ∈ feat|fix|chore|docs|refactor|test|build|ci|perf|style|revert)"
          echo "  Received: $msg"
          exit 1
        fi
