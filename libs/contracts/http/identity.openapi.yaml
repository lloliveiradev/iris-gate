openapi: 3.1.0
info:
  title: Iris Gate — Identity API
  version: 0.3.0
  description: |
    Merchant identity and API key authentication.
    Merchants and API keys are created and revoked by the operator CLI
    (apps/api/cmd/irisctl), not over HTTP.
  license:
    name: MIT
servers:
  - url: http://localhost:8080
    description: dev

tags:
  - name: identity

paths:
  /v1/me:
    get:
      operationId: getCurrentMerchant
      summary: Resolve merchant from API key (auth gate test)
      description: |
        Endpoint protegido. Requer `Authorization: Bearer <api-key>` no formato
        `irk_<prefix>.<secret>`. Retorna o merchant dono da chave.
      tags: [identity]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Merchant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: irk_<prefix>.<secret>

  schemas:
    Merchant:
      type: object
      additionalProperties: false
      required: [id, legal_name, document, contact_email, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        legal_name:
          type: string
        document:
          type: string
          pattern: '^[0-9]{14}$'
        contact_email:
          type: string
          format: email
        status:
          $ref: '#/components/schemas/MerchantStatus'
        created_at:
          type: string
          format: date-time

    MerchantStatus:
      type: string
      enum: [pending, active, suspended]

    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri

  responses:
    Unauthorized:
      description: 'API key ausente, malformada ou inválida.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: 'API key revogada ou sem permissão.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
