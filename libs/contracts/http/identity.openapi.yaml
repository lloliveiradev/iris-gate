openapi: 3.1.0
info:
  title: Iris Gate — Identity API
  version: 0.4.0
  description: |
    Identity and access: self-signup, sessions (access JWT plus rotating refresh
    token), members, invitations, API keys, the audit log and the platform
    console for the merchant lifecycle.

    Merchants and API keys can also be created and revoked by the operator CLI
    (apps/api/cmd/irisctl).

    Errors are `application/problem+json` (RFC 9457). The stable, machine-readable
    error code is the `code` member of `Problem`.
  license:
    name: MIT
servers:
  - url: http://localhost:8080
    description: dev

tags:
  - name: identity
  - name: auth
  - name: members
  - name: invitations
  - name: api-keys
  - name: audit
  - name: platform

paths:
  /v1/me:
    get:
      operationId: getCurrentMerchant
      summary: Resolve the merchant of the caller (auth gate test)
      description: |
        Protected endpoint. Requires `Authorization: Bearer <credential>`, either
        an API key (`irk_<prefix>.<secret>`) or a dashboard access JWT. Returns the
        merchant that owns the credential. Open to `pending` merchants.
      tags: [identity]
      security:
        - bearerAuth: []
        - accessToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Merchant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /.well-known/jwks.json:
    get:
      operationId: getJwks
      summary: Public signing keys
      description: |
        JSON Web Key Set with the Ed25519 public keys (`kty: OKP`, `crv: Ed25519`,
        `alg: EdDSA`) that verify access JWTs. During a rotation the previous key
        stays listed until the tokens it signed expire. Never exposes private
        key material.
      tags: [auth]
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JwkSet'

  /v1/auth/signup:
    post:
      operationId: signUp
      summary: Self-signup
      description: |
        Creates an unverified user, a `pending` merchant and an `owner` membership,
        then sends a verification email. Rate limited per IP and per email.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '201':
          description: Account created; verification email sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignUpResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/auth/verify-email:
    post:
      operationId: verifyEmail
      summary: Verify an email address with a single-use token
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '204':
          description: Email verified.
        '400':
          $ref: '#/components/responses/BadRequest'
        '410':
          $ref: '#/components/responses/Gone'

  /v1/auth/login:
    post:
      operationId: login
      summary: Sign in with email and password
      description: |
        Answers one generic `401 invalid_credentials` for an unknown email, a wrong
        password, or an unverified or disabled user. Rate limited per IP and per
        email. `audience` selects the dashboard or the platform console.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate the refresh token and issue a new access token
      description: |
        Presenting an already rotated refresh token outside the grace window
        revokes the whole family (`401 refresh_token_reused`). A concurrent
        refresh with the same token inside the grace window gets the same new
        pair, or `409 concurrent_refresh` when that pair is no longer available;
        the family is not revoked in that case.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Session refreshed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke the refresh family of the current session
      tags: [auth]
      security:
        - accessToken: []
      responses:
        '204':
          description: Session revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/auth/password-reset:
    post:
      operationId: requestPasswordReset
      summary: Request a password reset email
      description: |
        Always answers 202, whether or not the email belongs to a user, so the
        endpoint does not reveal which emails exist. The reset token is
        single-use and valid for one hour. Rate limited.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '202':
          description: Accepted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/auth/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      summary: Set a new password with a reset token
      description: Revokes every refresh family of the user.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
      responses:
        '204':
          description: Password changed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '410':
          $ref: '#/components/responses/Gone'

  /v1/auth/password-change:
    post:
      operationId: changePassword
      summary: Change the password of the signed-in user
      description: Revokes every refresh family of the user.
      tags: [auth]
      security:
        - accessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '204':
          description: Password changed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/auth/reauthenticate:
    post:
      operationId: reauthenticate
      summary: Step-up re-authentication
      description: |
        Verifies the password of the current user and issues a fresh access
        token whose `auth_time` is now. Sensitive actions (creating or rolling an
        API key, changing a member role, transferring ownership) require an
        `auth_time` within the last 5 minutes and otherwise answer
        `403 reauthentication_required`.
      tags: [auth]
      security:
        - accessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthenticateRequest'
      responses:
        '200':
          description: Fresh access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/auth/switch-merchant:
    post:
      operationId: switchMerchant
      summary: Issue an access token for another membership
      description: |
        The user must have an active membership in the target merchant. A
        merchant the user does not belong to answers 404, so existence is not
        leaked. `auth_time` is preserved.
      tags: [auth]
      security:
        - accessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwitchMerchantRequest'
      responses:
        '200':
          description: Access token for the target merchant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/members:
    get:
      operationId: listMembers
      summary: List the members of the active merchant
      description: Requires `members.manage`.
      tags: [members]
      security:
        - accessToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/members/transfer-ownership:
    post:
      operationId: transferOwnership
      summary: Transfer ownership to another active member
      description: |
        Only the current `owner` can call it, and it needs step-up
        (`403 reauthentication_required`). The current owner becomes `admin`.
        There is exactly one owner per merchant.
      tags: [members]
      security:
        - accessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferOwnershipRequest'
      responses:
        '204':
          description: Ownership transferred.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/members/{user_id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    patch:
      operationId: changeMemberRole
      summary: Change the role of a member
      description: |
        Requires `members.manage` and step-up (`403 reauthentication_required`).
        The role cannot be set to `owner` (use ownership transfer) and the owner
        cannot be demoted.
      tags: [members]
      security:
        - accessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeMemberRoleRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      operationId: removeMember
      summary: Remove a member
      description: |
        Requires `members.manage`. The sole owner cannot be removed
        (`409 cannot_remove_owner`). The member loses access within one access
        token lifetime and refresh fails immediately.
      tags: [members]
      security:
        - accessToken: []
      responses:
        '204':
          description: Member removed.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/invitations:
    get:
      operationId: listInvitations
      summary: List the invitations of the active merchant
      description: Requires `members.manage`. Open to `pending` merchants.
      tags: [invitations]
      security:
        - accessToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createInvitation
      summary: Invite a member by email
      description: |
        Requires `members.manage`. The invitation token is single-use, stored as
        a hash and valid for 72 hours; it is only sent by email. The role cannot
        be `owner`. Open to `pending` merchants.
      tags: [invitations]
      security:
        - accessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
      responses:
        '201':
          description: Invitation created and email sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/invitations/{id}/revoke:
    parameters:
      - $ref: '#/components/parameters/InvitationId'
    post:
      operationId: revokeInvitation
      summary: Revoke a pending invitation
      description: Requires `members.manage`. Scoped to the active merchant.
      tags: [invitations]
      security:
        - accessToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/invitations/{token}/accept:
    parameters:
      - name: token
        in: path
        required: true
        description: Single-use invitation token received by email.
        schema:
          type: string
          minLength: 16
          maxLength: 256
    post:
      operationId: acceptInvitation
      summary: Accept an invitation
      description: |
        The token is claimed atomically: only one caller wins; a second accept
        answers `410 invitation_unavailable`.

        - If no user exists for the invited email, `name` and `password` are
          required and an active, email-verified user is created.
        - If a user already exists, the caller must prove ownership of that
          account, either with an access JWT of that user or with `password`.
          An unauthenticated request without the password is rejected
          (`401 authentication_required`), so a leaked invitation email cannot
          hijack an existing account.
        Rate limited.
      tags: [invitations]
      security:
        - {}
        - accessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
      responses:
        '200':
          description: Invitation accepted; the user is signed in on the merchant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /v1/api-keys:
    get:
      operationId: listApiKeys
      summary: List the API keys of the active merchant
      description: |
        Requires `api_keys.manage`. Returns metadata only. Never returns a hash or
        the secret of a `secret` or `restricted` key; a `publishable` key is
        public and its `publishable_key` is returned.
      tags: [api-keys]
      security:
        - accessToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createApiKey
      summary: Create an API key
      description: |
        Requires `api_keys.manage` and step-up (`403 reauthentication_required`).
        The plaintext `secret` of a `secret` or `restricted` key is returned
        once, in this response. Open to `pending` merchants.
      tags: [api-keys]
      security:
        - accessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequest'
      responses:
        '201':
          description: API key created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedApiKey'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/api-keys/{id}/roll:
    parameters:
      - $ref: '#/components/parameters/ApiKeyId'
    post:
      operationId: rollApiKey
      summary: Roll an API key
      description: |
        Requires `api_keys.manage` and step-up. Issues a new key with the same
        kind, name and scopes, and sets the expiry of the old key to now plus
        `overlap_seconds` (default 24 hours, maximum 7 days). Both keys work
        during the overlap. Rolling a revoked or expired key answers 409.
      tags: [api-keys]
      security:
        - accessToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RollApiKeyRequest'
      responses:
        '201':
          description: New key issued; its secret is shown once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssuedApiKey'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/api-keys/{id}/revoke:
    parameters:
      - $ref: '#/components/parameters/ApiKeyId'
    post:
      operationId: revokeApiKey
      summary: Revoke an API key
      description: 'Requires `api_keys.manage`. Idempotent, so revoking a revoked key returns it unchanged.'
      tags: [api-keys]
      security:
        - accessToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKey'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/audit-events:
    get:
      operationId: listAuditEvents
      summary: List the audit events of the active merchant
      description: |
        Requires `logs.read`. Only events of the caller's merchant are returned,
        newest first. Open to `pending` merchants.
      tags: [audit]
      security:
        - accessToken: []
      parameters:
        - name: action
          in: query
          required: false
          description: Exact action, for example `api_key.created`.
          schema:
            type: string
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /v1/platform/merchants:
    get:
      operationId: listPlatformMerchants
      summary: List merchants (platform console)
      description: Requires a platform access JWT (`aud` = `iris-platform`) with the `platform_admin` role.
      tags: [platform]
      security:
        - platformToken: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/MerchantStatus'
        - name: q
          in: query
          required: false
          description: Case-insensitive match on the legal name.
          schema:
            type: string
            maxLength: 120
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MerchantPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: createPlatformMerchant
      summary: Create a merchant (sales-led)
      description: |
        Creates an `active` merchant and an owner invitation, and sends the
        invitation email after commit.
      tags: [platform]
      security:
        - platformToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlatformMerchantRequest'
      responses:
        '201':
          description: Merchant created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Merchant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/platform/merchants/{id}/approve:
    parameters:
      - $ref: '#/components/parameters/MerchantId'
    post:
      operationId: approvePlatformMerchant
      summary: Approve a pending merchant
      description: '`pending` to `active`. Any other status answers 409 `invalid_status_transition`.'
      tags: [platform]
      security:
        - platformToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Merchant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/platform/merchants/{id}/suspend:
    parameters:
      - $ref: '#/components/parameters/MerchantId'
    post:
      operationId: suspendPlatformMerchant
      summary: Suspend an active merchant
      description: '`active` to `suspended`. Any other status answers 409 `invalid_status_transition`.'
      tags: [platform]
      security:
        - platformToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuspendMerchantRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Merchant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/platform/merchants/{id}/reactivate:
    parameters:
      - $ref: '#/components/parameters/MerchantId'
    post:
      operationId: reactivatePlatformMerchant
      summary: Reactivate a suspended merchant
      description: '`suspended` to `active`. Any other status answers 409 `invalid_status_transition`.'
      tags: [platform]
      security:
        - platformToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Merchant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: irk_<prefix>.<secret>
      description: Secret or restricted API key.
    accessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Dashboard access JWT (`aud` = `iris-dashboard`, EdDSA, 15 minutes).
    platformToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Platform console access JWT (`aud` = `iris-platform`, EdDSA, 15 minutes).

  parameters:
    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvitationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ApiKeyId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MerchantId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from `next_cursor` of the previous page.
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25

  schemas:
    Merchant:
      type: object
      additionalProperties: false
      required: [id, legal_name, document, contact_email, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        legal_name:
          type: string
        document:
          type: string
          pattern: '^[0-9]{14}$'
        contact_email:
          type: string
          format: email
        status:
          $ref: '#/components/schemas/MerchantStatus'
        created_at:
          type: string
          format: date-time

    MerchantStatus:
      type: string
      enum: [pending, active, suspended]

    MerchantPage:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Merchant'
        next_cursor:
          type: [string, 'null']

    MemberRole:
      type: string
      enum: [owner, admin, developer, operations, risk_analyst, viewer]

    AssignableMemberRole:
      description: Roles that can be granted by invitation or role change. `owner` only moves through ownership transfer.
      type: string
      enum: [admin, developer, operations, risk_analyst, viewer]

    Password:
      type: string
      format: password
      minLength: 12
      maxLength: 128
      writeOnly: true

    TokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 16
          maxLength: 256

    SignUpRequest:
      type: object
      additionalProperties: false
      required: [name, email, password, legal_name, document]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
        password:
          $ref: '#/components/schemas/Password'
        legal_name:
          type: string
          minLength: 1
          maxLength: 120
        document:
          type: string
          pattern: '^[0-9]{14}$'

    SignUpResponse:
      type: object
      additionalProperties: false
      required: [user_id, merchant_id, merchant_status]
      properties:
        user_id:
          type: string
          format: uuid
        merchant_id:
          type: string
          format: uuid
        merchant_status:
          $ref: '#/components/schemas/MerchantStatus'

    TokenAudience:
      type: string
      enum: [iris-dashboard, iris-platform]

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          maxLength: 128
          writeOnly: true
        audience:
          $ref: '#/components/schemas/TokenAudience'
        merchant_id:
          description: Active merchant to sign in to. Defaults to the default membership of the user.
          type: string
          format: uuid

    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 16
          maxLength: 512

    AccessToken:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in, auth_time]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          description: Access token lifetime in seconds.
          type: integer
          minimum: 1
        auth_time:
          description: When the user last proved the password (the `auth_time` claim). Step-up needs it within 5 minutes.
          type: string
          format: date-time

    TokenPair:
      allOf:
        - $ref: '#/components/schemas/AccessToken'
        - type: object
          required: [refresh_token]
          properties:
            refresh_token:
              description: Opaque, single-use refresh token. Shown only here; store it server-side.
              type: string

    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email

    PasswordResetConfirmRequest:
      type: object
      additionalProperties: false
      required: [token, new_password]
      properties:
        token:
          type: string
          minLength: 16
          maxLength: 256
        new_password:
          $ref: '#/components/schemas/Password'

    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
          format: password
          maxLength: 128
          writeOnly: true
        new_password:
          $ref: '#/components/schemas/Password'

    ReauthenticateRequest:
      type: object
      additionalProperties: false
      required: [password]
      properties:
        password:
          type: string
          format: password
          maxLength: 128
          writeOnly: true

    SwitchMerchantRequest:
      type: object
      additionalProperties: false
      required: [target_merchant_id]
      properties:
        target_merchant_id:
          type: string
          format: uuid

    Member:
      type: object
      additionalProperties: false
      required: [user_id, name, email, role, status, created_at]
      properties:
        user_id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/MemberRole'
        status:
          type: string
          enum: [active, removed]
        created_at:
          type: string
          format: date-time

    MemberList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Member'

    ChangeMemberRoleRequest:
      type: object
      additionalProperties: false
      required: [role]
      properties:
        role:
          $ref: '#/components/schemas/AssignableMemberRole'

    TransferOwnershipRequest:
      type: object
      additionalProperties: false
      required: [target_user_id]
      properties:
        target_user_id:
          type: string
          format: uuid

    Invitation:
      type: object
      additionalProperties: false
      required: [id, email, role, status, expires_at, created_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/MemberRole'
        status:
          type: string
          enum: [pending, accepted, expired, revoked]
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    InvitationList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Invitation'

    CreateInvitationRequest:
      type: object
      additionalProperties: false
      required: [email, role]
      properties:
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/AssignableMemberRole'

    AcceptInvitationRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          description: Required when no user exists for the invited email.
          type: string
          minLength: 1
          maxLength: 120
        password:
          description: |
            Required when no user exists (new password) and, for an existing user
            without an access JWT, to prove ownership of the account.
          type: string
          format: password
          maxLength: 128
          writeOnly: true

    ApiKeyKind:
      type: string
      enum: [secret, restricted, publishable]

    ApiKeyStatus:
      type: string
      enum: [active, revoked, expired]

    Permission:
      description: A merchant permission (see the role matrix in the design docs), for example `payments.read`.
      type: string
      pattern: '^[a-z_]+(\.[a-z_]+)+$'

    ApiKey:
      type: object
      additionalProperties: false
      required: [id, kind, name, prefix, scopes, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/ApiKeyKind'
        name:
          type: string
        prefix:
          type: string
        scopes:
          description: Permissions of a `restricted` key. Empty for the other kinds.
          type: array
          items:
            $ref: '#/components/schemas/Permission'
        status:
          $ref: '#/components/schemas/ApiKeyStatus'
        publishable_key:
          description: Public `ipk_` value. Present only when `kind` is `publishable`.
          type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: [string, 'null']
          format: date-time
        last_used_at:
          type: [string, 'null']
          format: date-time
        revoked_at:
          type: [string, 'null']
          format: date-time

    ApiKeyList:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ApiKey'

    IssuedApiKey:
      allOf:
        - $ref: '#/components/schemas/ApiKey'
        - type: object
          properties:
            secret:
              description: Plaintext `irk_` or `irr_` token, returned once. Absent for `publishable` keys.
              type: string

    CreateApiKeyRequest:
      type: object
      additionalProperties: false
      required: [kind, name]
      properties:
        kind:
          $ref: '#/components/schemas/ApiKeyKind'
        name:
          type: string
          minLength: 1
          maxLength: 80
        scopes:
          description: Required for `restricted`, ignored otherwise.
          type: array
          items:
            $ref: '#/components/schemas/Permission'
        expires_at:
          type: string
          format: date-time

    RollApiKeyRequest:
      type: object
      additionalProperties: false
      properties:
        overlap_seconds:
          description: How long the old key keeps working. Default 86400 (24 hours), maximum 604800 (7 days).
          type: integer
          minimum: 0
          maximum: 604800
          default: 86400

    ActorType:
      type: string
      enum: [user, api_key, platform_user, system]

    AuditEvent:
      type: object
      additionalProperties: false
      required: [id, action, entity_type, actor_type, actor_id, occurred_at]
      properties:
        id:
          type: string
          format: uuid
        action:
          type: string
          description: For example `api_key.created`, `member.role_changed`.
        entity_type:
          type: string
        entity_id:
          type: [string, 'null']
        actor_type:
          $ref: '#/components/schemas/ActorType'
        actor_id:
          type: string
        request_id:
          type: [string, 'null']
        data:
          description: Sanitized details. Never contains secrets, tokens or raw emails.
          type: object
          additionalProperties: true
        occurred_at:
          type: string
          format: date-time

    AuditEventPage:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        next_cursor:
          type: [string, 'null']

    CreatePlatformMerchantRequest:
      type: object
      additionalProperties: false
      required: [legal_name, document, owner_email]
      properties:
        legal_name:
          type: string
          minLength: 1
          maxLength: 120
        document:
          type: string
          pattern: '^[0-9]{14}$'
        owner_email:
          type: string
          format: email

    SuspendMerchantRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type: string
          maxLength: 500

    Jwk:
      type: object
      additionalProperties: false
      required: [kty, crv, alg, use, kid, x]
      properties:
        kty:
          type: string
          enum: [OKP]
        crv:
          type: string
          enum: [Ed25519]
        alg:
          type: string
          enum: [EdDSA]
        use:
          type: string
          enum: [sig]
        kid:
          type: string
        x:
          description: Base64url public key.
          type: string

    JwkSet:
      type: object
      additionalProperties: false
      required: [keys]
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/Jwk'

    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri
        code:
          description: |
            Stable error code, for example `invalid_credentials`,
            `reauthentication_required`, `merchant_not_active`,
            `concurrent_refresh`, `refresh_token_reused`, `cannot_remove_owner`,
            `invitation_unavailable`, `invalid_status_transition`,
            `rate_limited`, `validation_error`.
          type: string

  responses:
    BadRequest:
      description: 'Invalid request body or query (`validation_error`).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: 'Credential missing, malformed, expired or invalid (`invalid_credentials`, `refresh_token_reused`, `authentication_required`).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: 'Revoked credential, missing permission, `merchant_not_active` or `reauthentication_required`.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: 'Resource not found, or it belongs to another merchant (`not_found`).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: 'State conflict (`concurrent_refresh`, `cannot_remove_owner`, `invalid_status_transition`, duplicate email or document).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Gone:
      description: 'Token expired, already used or revoked (`token_invalid`, `invitation_unavailable`).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: 'Rate limit exceeded (`rate_limited`).'
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
