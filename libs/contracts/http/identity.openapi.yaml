openapi: 3.1.0
info:
  title: Iris Gate — Identity API
  version: 0.2.0
  description: |
    Merchant identity, API keys, operators.
    Phase 2 do roadmap implementa CreateMerchant + IssueApiKey + AuthenticateApiKey + RevokeApiKey.
  license:
    name: MIT
servers:
  - url: http://localhost:8080
    description: dev

tags:
  - name: identity

paths:
  /v1/merchants:
    post:
      operationId: createMerchant
      summary: Create a new merchant
      tags: [identity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMerchantRequest'
      responses:
        '201':
          description: Merchant created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Merchant'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'

  /v1/api-keys:
    post:
      operationId: issueApiKey
      summary: Issue a new API key for a merchant
      description: |
        Retorna o segredo em texto-claro **uma única vez** no campo `secret`.
        Após esta resposta, apenas o `prefix` permanece consultável; o secret é
        armazenado como hash Argon2id.
      tags: [identity]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IssueApiKeyRequest'
      responses:
        '201':
          description: API key issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueApiKeyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/api-keys/{id}/revoke:
    post:
      operationId: revokeApiKey
      summary: Revoke an API key
      tags: [identity]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: API key revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKey'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/me:
    get:
      operationId: getCurrentMerchant
      summary: Resolve merchant from API key (auth gate test)
      description: |
        Endpoint protegido. Requer `Authorization: Bearer <api-key>` no formato
        `irk_<prefix>.<secret>`. Retorna o merchant dono da chave.
      tags: [identity]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Merchant'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: irk_<prefix>.<secret>

  schemas:
    CreateMerchantRequest:
      type: object
      additionalProperties: false
      required: [legal_name, document, contact_email]
      properties:
        legal_name:
          type: string
          minLength: 1
          maxLength: 200
        document:
          type: string
          pattern: '^[0-9]{14}$'
          description: 'CNPJ, somente dígitos.'
        contact_email:
          type: string
          format: email

    Merchant:
      type: object
      additionalProperties: false
      required: [id, legal_name, document, contact_email, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        legal_name:
          type: string
        document:
          type: string
          pattern: '^[0-9]{14}$'
        contact_email:
          type: string
          format: email
        status:
          $ref: '#/components/schemas/MerchantStatus'
        created_at:
          type: string
          format: date-time

    MerchantStatus:
      type: string
      enum: [pending, active, suspended]

    IssueApiKeyRequest:
      type: object
      additionalProperties: false
      required: [merchant_id]
      properties:
        merchant_id:
          type: string
          format: uuid
        scopes:
          type: array
          items:
            type: string
          default: []

    IssueApiKeyResponse:
      type: object
      additionalProperties: false
      required: [api_key, secret]
      properties:
        api_key:
          $ref: '#/components/schemas/ApiKey'
        secret:
          type: string
          description: 'Token completo `irk_<prefix>.<secret>`. Só aparece nesta resposta.'

    ApiKey:
      type: object
      additionalProperties: false
      required: [id, merchant_id, prefix, status, scopes, created_at]
      properties:
        id:
          type: string
          format: uuid
        merchant_id:
          type: string
          format: uuid
        prefix:
          type: string
        status:
          $ref: '#/components/schemas/ApiKeyStatus'
        scopes:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time

    ApiKeyStatus:
      type: string
      enum: [active, revoked]

    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri

  responses:
    BadRequest:
      description: 'Requisição inválida.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: 'Conflito (ex.: documento já cadastrado).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: 'Recurso não encontrado.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: 'API key ausente, malformada ou inválida.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: 'API key revogada ou sem permissão.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
