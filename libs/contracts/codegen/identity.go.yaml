# oapi-codegen config para libs/contracts/http/identity.openapi.yaml
# Os paths abaixo são relativos ao diretório onde a tool é executada,
# que é `libs/contracts/generated/go/` (módulo Go que registra a tool).

package: identity
output: identity/types.gen.go

generate:
  models: true
  embedded-spec: false
  client: false
  std-http-server: false

output-options:
  skip-prune: true
