asyncapi: 2.6.0
info:
  title: Iris Gate — Domain Events
  version: 0.1.0
  description: |
    Catálogo de eventos de domínio publicados em Kafka.
    Tópicos seguem `<contexto>.<agregado>.<evento>.v<n>`.
    Breaking change exige `vN+1` + janela de dual-publish (ver ADR-0003).

defaultContentType: application/json

servers:
  local:
    url: localhost:9092
    protocol: kafka
    description: Apache Kafka (KRaft) local — ver infra/docker.

channels:
  identity.merchant.created.v1:
    description: Disparado quando um merchant é criado.
    publish:
      operationId: publishMerchantCreatedV1
      message:
        $ref: '#/components/messages/MerchantCreatedV1'

  payments.payment_intent.created.v1:
    description: Disparado quando um PaymentIntent é criado (status=pending).
    publish:
      operationId: publishPaymentIntentCreatedV1
      message:
        $ref: '#/components/messages/PaymentIntentCreatedV1'

  payments.payment_intent.authorized.v1:
    description: Disparado após o adquirente aprovar a autorização.
    publish:
      operationId: publishPaymentIntentAuthorizedV1
      message:
        $ref: '#/components/messages/PaymentIntentAuthorizedV1'

  payments.payment_intent.captured.v1:
    description: Disparado quando uma autorização é capturada.
    publish:
      operationId: publishPaymentIntentCapturedV1
      message:
        $ref: '#/components/messages/PaymentIntentCapturedV1'

  fraud.assessment.completed.v1:
    description: Resultado da avaliação de risco (decision + score + reasons).
    publish:
      operationId: publishFraudAssessmentCompletedV1
      message:
        $ref: '#/components/messages/FraudAssessmentCompletedV1'

  fraud.assessment.failed.dlq:
    description: Dead-letter para mensagens que falharam terminalmente (payload inválido / erro não-retryable).
    publish:
      operationId: publishFraudAssessmentFailedDLQ
      message:
        $ref: '#/components/messages/FraudAssessmentRequestedV1'

components:
  messages:
    MerchantCreatedV1:
      name: MerchantCreatedV1
      title: Merchant Created (v1)
      contentType: application/json
      headers:
        $ref: '#/components/schemas/CommonHeaders'
      payload:
        $ref: 'schemas/identity/merchant-created.v1.json'

    PaymentIntentCreatedV1:
      name: PaymentIntentCreatedV1
      title: Payment Intent Created (v1)
      contentType: application/json
      headers:
        $ref: '#/components/schemas/CommonHeaders'
      payload:
        $ref: 'schemas/payments/payment-intent-created.v1.json'

    PaymentIntentAuthorizedV1:
      name: PaymentIntentAuthorizedV1
      title: Payment Intent Authorized (v1)
      contentType: application/json
      headers:
        $ref: '#/components/schemas/CommonHeaders'
      payload:
        $ref: 'schemas/payments/payment-intent-authorized.v1.json'

    PaymentIntentCapturedV1:
      name: PaymentIntentCapturedV1
      title: Payment Intent Captured (v1)
      contentType: application/json
      headers:
        $ref: '#/components/schemas/CommonHeaders'
      payload:
        $ref: 'schemas/payments/payment-intent-captured.v1.json'

    FraudAssessmentCompletedV1:
      name: FraudAssessmentCompletedV1
      title: Fraud Assessment Completed (v1)
      contentType: application/json
      headers:
        $ref: '#/components/schemas/CommonHeaders'
      payload:
        $ref: 'schemas/fraud/assessment-completed.v1.json'

  schemas:
    CommonHeaders:
      type: object
      required: [event-id, event-type, published-at]
      properties:
        traceparent:
          type: string
          description: W3C Trace Context.
        event-id:
          type: string
          format: uuid
        event-type:
          type: string
          description: Tópico/nome canônico do evento.
        published-at:
          type: string
          format: date-time
