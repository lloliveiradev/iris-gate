asyncapi: 2.6.0
info:
  title: Iris Gate — Domain Events
  version: 0.1.0
  description: |
    Catalog of domain events published to Kafka.
    Topics follow `<context>.<aggregate>.<event>.v<n>`.
    Breaking changes require `vN+1` and a dual-publish window (see ADR-0003).

defaultContentType: application/json

servers:
  local:
    url: localhost:9092
    protocol: kafka
    description: Local Apache Kafka (KRaft) — see infra/docker.

channels:
  identity.merchant.created.v1:
    description: Emitted when a merchant is created.
    publish:
      operationId: publishMerchantCreatedV1
      message:
        $ref: '#/components/messages/MerchantCreatedV1'

  payments.payment_intent.created.v1:
    description: Emitted when a PaymentIntent is created (status=pending).
    publish:
      operationId: publishPaymentIntentCreatedV1
      message:
        $ref: '#/components/messages/PaymentIntentCreatedV1'

  payments.payment_intent.authorized.v1:
    description: Emitted after the acquirer approves the authorization.
    publish:
      operationId: publishPaymentIntentAuthorizedV1
      message:
        $ref: '#/components/messages/PaymentIntentAuthorizedV1'

  payments.payment_intent.captured.v1:
    description: Emitted when an authorization is captured.
    publish:
      operationId: publishPaymentIntentCapturedV1
      message:
        $ref: '#/components/messages/PaymentIntentCapturedV1'

  payments.payment_intent.failed.v1:
    description: Emitted when the acquirer declines the authorization (status=failed, with a failure_code).
    publish:
      operationId: publishPaymentIntentFailedV1
      message:
        $ref: '#/components/messages/PaymentIntentFailedV1'

  fraud.assessment.completed.v1:
    description: Risk assessment result (decision + score + reasons).
    publish:
      operationId: publishFraudAssessmentCompletedV1
      message:
        $ref: '#/components/messages/FraudAssessmentCompletedV1'

components:
  messages:
    MerchantCreatedV1:
      name: MerchantCreatedV1
      title: Merchant Created (v1)
      contentType: application/json
      headers:
        $ref: '#/components/schemas/CommonHeaders'
      payload:
        $ref: 'schemas/identity/merchant-created.v1.json'

    PaymentIntentCreatedV1:
      name: PaymentIntentCreatedV1
      title: Payment Intent Created (v1)
      contentType: application/json
      headers:
        $ref: '#/components/schemas/CommonHeaders'
      payload:
        $ref: 'schemas/payments/payment-intent-created.v1.json'

    PaymentIntentAuthorizedV1:
      name: PaymentIntentAuthorizedV1
      title: Payment Intent Authorized (v1)
      contentType: application/json
      headers:
        $ref: '#/components/schemas/CommonHeaders'
      payload:
        $ref: 'schemas/payments/payment-intent-authorized.v1.json'

    PaymentIntentCapturedV1:
      name: PaymentIntentCapturedV1
      title: Payment Intent Captured (v1)
      contentType: application/json
      headers:
        $ref: '#/components/schemas/CommonHeaders'
      payload:
        $ref: 'schemas/payments/payment-intent-captured.v1.json'

    PaymentIntentFailedV1:
      name: PaymentIntentFailedV1
      title: Payment Intent Failed (v1)
      contentType: application/json
      headers:
        $ref: '#/components/schemas/CommonHeaders'
      payload:
        $ref: 'schemas/payments/payment-intent-failed.v1.json'

    FraudAssessmentCompletedV1:
      name: FraudAssessmentCompletedV1
      title: Fraud Assessment Completed (v1)
      contentType: application/json
      headers:
        $ref: '#/components/schemas/CommonHeaders'
      payload:
        $ref: 'schemas/fraud/assessment-completed.v1.json'

  schemas:
    CommonHeaders:
      type: object
      required: [event-id, event-type, published-at]
      properties:
        traceparent:
          type: string
          description: W3C Trace Context.
        event-id:
          type: string
          format: uuid
        event-type:
          type: string
          description: Canonical event topic/name.
        published-at:
          type: string
          format: date-time
