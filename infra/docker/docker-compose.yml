name: ig

x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  postgres:
    image: postgres:18.6-alpine
    container_name: ig-postgres
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iris}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iris}
      POSTGRES_DB: ${POSTGRES_DB:-iris}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - '${POSTGRES_PORT:-15432}:5432'
    volumes:
      - ig-postgres-data:/var/lib/postgresql/data
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-iris} -d ${POSTGRES_DB:-iris}']
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [ig]

  kafka:
    image: apache/kafka:4.4.0
    container_name: ig-kafka
    restart: unless-stopped
    logging: *default-logging
    ports:
      # Host port maps to the PLAINTEXT_HOST listener (container 29092). The
      # internal PLAINTEXT listener (container 9092) is for in-network clients
      # only and is NOT published; it advertises kafka:9092 which is only
      # resolvable inside the docker network. Host clients reach Kafka via
      # localhost:${KAFKA_PORT}, which lands on PLAINTEXT_HOST (advertised as
      # localhost:${KAFKA_PORT}) so subsequent metadata round-trips work.
      - '${KAFKA_PORT:-19092}:29092'
    environment:
      # KRaft (no Zookeeper) — single-node combined controller+broker
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:${KAFKA_PORT:-19092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_RETENTION_BYTES: 536870912
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-iris-local-cluster-0001}
    volumes:
      - ig-kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1',
        ]
      interval: 10s
      timeout: 10s
      retries: 10
    networks: [ig]

  # One-shot topic provisioner. Runs after kafka is healthy, creates every
  # topic in kafka/topics.txt with --if-not-exists (idempotent), then exits.
  # Auto-create is disabled on the broker: add a line to kafka/topics.txt when
  # you ship a new event contract.
  kafka-init:
    image: apache/kafka:4.4.0
    container_name: ig-kafka-init
    logging: *default-logging
    depends_on:
      kafka:
        condition: service_healthy
    restart: 'no'
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
    volumes:
      - ./kafka:/opt/iris/kafka:ro
    entrypoint: ['/bin/sh', '/opt/iris/kafka/create-topics.sh']
    networks: [ig]

  karapace:
    image: ghcr.io/aiven-open/karapace:6.2.4
    container_name: ig-karapace
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - '${KARAPACE_PORT:-18081}:8081'
    environment:
      KARAPACE_BOOTSTRAP_URI: kafka:9092
      KARAPACE_PORT: 8081
      KARAPACE_HOST: 0.0.0.0
      KARAPACE_ADVERTISED_HOSTNAME: karapace
      KARAPACE_COMPATIBILITY: BACKWARD
      KARAPACE_CLIENT_ID: karapace
      KARAPACE_GROUP_ID: karapace-registry
      KARAPACE_MASTER_ELIGIBILITY: 'true'
      KARAPACE_TOPIC_NAME: _schemas
      KARAPACE_LOG_LEVEL: WARNING
      KARAPACE_KARAPACE_REGISTRY: 'true'
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat > /opt/karapace/registry.config.json <<EOF
        {
          "bootstrap_uri": "kafka:9092",
          "host": "0.0.0.0",
          "port": 8081,
          "advertised_hostname": "karapace",
          "compatibility": "BACKWARD",
          "client_id": "karapace",
          "group_id": "karapace-registry",
          "master_eligibility": true,
          "topic_name": "_schemas",
          "log_level": "WARNING"
        }
        EOF
        exec python3 -m karapace /opt/karapace/registry.config.json
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O- http://localhost:8081/_health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [ig]

  anti-fraud:
    build:
      # Context is the monorepo root so yarn workspaces resolve correctly.
      context: ../..
      dockerfile: apps/anti-fraud/Dockerfile.dev
    container_name: ig-anti-fraud
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    ports:
      - '${ANTI_FRAUD_PORT:-13001}:3001'
    environment:
      # Internal hostnames — kafkajs metadata advertises kafka:9092 inside the network.
      DATABASE_URL: postgresql://${POSTGRES_USER:-iris}:${POSTGRES_PASSWORD:-iris}@postgres:5432/${ANTI_FRAUD_DB:-antifraud}?schema=public
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: anti-fraud
      KAFKAJS_NO_PARTITIONER_WARNING: '1'
      PORT: 3001
      NODE_ENV: development
    volumes:
      # Hot-reload: mount only the watch surface; node_modules + dist stay baked.
      - ../../apps/anti-fraud/src:/repo/apps/anti-fraud/src
      - ../../apps/anti-fraud/prisma:/repo/apps/anti-fraud/prisma
      - ../../apps/anti-fraud/nest-cli.json:/repo/apps/anti-fraud/nest-cli.json
      - ../../apps/anti-fraud/tsconfig.json:/repo/apps/anti-fraud/tsconfig.json
      - ../../apps/anti-fraud/prisma.config.ts:/repo/apps/anti-fraud/prisma.config.ts
      - ../../configs:/repo/configs:ro
    networks: [ig]

volumes:
  ig-postgres-data:
    name: ig-postgres-data
  ig-kafka-data:
    name: ig-kafka-data

networks:
  ig:
    name: ig
    driver: bridge
